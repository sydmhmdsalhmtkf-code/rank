<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعیین مقام کصخل ها</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#ffe3f1;--bg2:#e6dcff;--card:#ffffffcc;--tx:#3b1346;--ac:#e91e8c;--ac2:#8e44ff;--bd:#f3b6d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0a3a;--bg2:#12062b;--card:#2d1744cc;--tx:#ffe9f6;--bd:#6b2d85}}
:root[data-theme="dark"]{--bg1:#2a0a3a;--bg2:#12062b;--card:#2d1744cc;--tx:#ffe9f6;--bd:#6b2d85}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{text-align:center;font-weight:900;font-size:clamp(1.6rem,6vw,2.4rem);background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 18px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.tab{font:inherit;font-weight:900;font-size:1.1rem;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:10px 26px;cursor:pointer}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 6px 18px #e91e8c55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:20px;overflow:hidden;cursor:pointer;text-align:center;padding-bottom:10px}
.card.t1{border-color:#ffc107;box-shadow:0 0 20px #ffc10766}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card b{display:block;margin-top:8px;padding:0 6px}
.tt{display:block;font-style:normal;font-weight:900;font-size:.85rem;color:var(--ac);margin-top:2px}
.rk{position:absolute;top:8px;right:8px;font-size:1.5rem;font-weight:900;background:#000a;color:#fff;border-radius:12px;padding:0 10px}
.empty{text-align:center;opacity:.7;padding:50px 10px;grid-column:1/-1}
#lb{position:fixed;inset:0;z-index:50;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb img{max-width:100%;max-height:78vh;border-radius:16px}
#lb p{color:#fff;font-weight:900;font-size:1.3rem;margin:0}
/* intro */
#intro{position:fixed;inset:0;z-index:99;overflow:hidden;background:#12012a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:20px;transition:opacity .9s}
#intro.hide{opacity:0;pointer-events:none}
#intro.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-12px,8px)}40%{transform:translate(10px,-10px)}60%{transform:translate(-8px,-6px)}80%{transform:translate(8px,10px)}}
.beam{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;mix-blend-mode:screen;opacity:.55;animation:spin 6s linear infinite;
background:conic-gradient(from 0deg,#ff2d95,transparent 12%,#00e5ff 25%,transparent 37%,#ffee00 50%,transparent 62%,#8e44ff 75%,transparent 87%,#ff2d95)}
.beam.b2{animation-duration:9s;animation-direction:reverse;opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}
.strobe{position:absolute;inset:0;background:#fff;opacity:0;animation:str 1.2s steps(1) infinite;mix-blend-mode:overlay}
@keyframes str{0%{opacity:.25}8%{opacity:0}}
#ttl{position:relative;z-index:5;margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;font-weight:900;font-size:clamp(2rem,10vw,3.6rem);line-height:1.3}
#ttl span{display:inline-block;color:#fff;text-shadow:0 0 14px #ff2d95,0 0 30px #00e5ff;animation:wob 1s ease-in-out infinite,hue 3s linear infinite}
#ttl span:nth-child(2n){animation-delay:-.3s}#ttl span:nth-child(3n){animation-delay:-.6s}
#ttl span:nth-child(3){font-size:1.25em}
@keyframes wob{0%,100%{transform:rotate(-8deg) translateY(0) scale(1)}50%{transform:rotate(8deg) translateY(-14px) scale(1.12)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.cl{position:absolute;z-index:4;animation:bnc 1.1s ease-in-out infinite;user-select:none}
@keyframes bnc{0%,100%{transform:translateY(0) rotate(-15deg)}50%{transform:translateY(-30px) rotate(15deg) scale(1.2)}}
.bomb{position:absolute;bottom:14%;z-index:2;font-size:84px;filter:drop-shadow(0 0 16px #ff9800)}
#bm1{left:12%}#bm2{right:12%}
.bomb.fuse{animation:fz .15s infinite}
@keyframes fz{0%,100%{transform:translateX(-5px) scale(1.05)}50%{transform:translateX(5px) scale(1.2)}}
.bomb.gone{visibility:hidden}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.pt{position:absolute;z-index:7;pointer-events:none;user-select:none}
.bw{position:absolute;z-index:9;font-weight:900;font-size:clamp(2rem,12vw,4.5rem);color:#ffeb3b;text-shadow:0 0 20px #f50,3px 3px 0 #d50000;pointer-events:none}
#enter{position:relative;z-index:10;font:inherit;font-weight:900;font-size:1.1rem;border:0;border-radius:999px;padding:14px 30px;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 8px 24px #e91e8c88;cursor:pointer;transition:.4s}
#enter:disabled{filter:grayscale(1);opacity:.5;cursor:default;box-shadow:none}
#enter:not(:disabled){animation:rdy 1s ease-in-out infinite}
@keyframes rdy{50%{transform:scale(1.1)}}
</style>
</head>
<body>
<div id="intro">
  <div class="beam"></div><div class="beam b2"></div><div class="strobe"></div>
  <span class="cl" style="top:8%;right:8%;font-size:56px">🤡</span>
  <span class="cl" style="top:12%;left:7%;font-size:48px;animation-delay:-.4s">🥴</span>
  <span class="cl" style="top:34%;left:4%;font-size:44px;animation-delay:-.7s">🤪</span>
  <span class="cl" style="top:32%;right:4%;font-size:50px;animation-delay:-.2s">🤡</span>
  <span class="cl" style="bottom:36%;left:30%;font-size:40px;animation-delay:-.5s">🎈</span>
  <span class="cl" style="bottom:34%;right:28%;font-size:40px;animation-delay:-.9s">🎉</span>
  <span class="bomb" id="bm1">💣</span><span class="bomb" id="bm2">💣</span>
  <h2 id="ttl"><span>به</span><span>جمع</span><span>کصخلا</span><span>خوش</span><span>اومدی</span></h2>
  <button id="enter" disabled>صبر کن بمب‌ها بترکن... 💣</button>
  <div id="flash"></div>
</div>

<div id="lb"><img alt=""><p></p></div>

<main>
  <h1>🏆 تعیین مقام کصخل ها 🏆</h1>
  <div class="tabs">
    <button class="tab on" data-k="girls">👧 دخترا</button>
    <button class="tab" data-k="boys">👦 پسرا</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
// ===== داده‌ها: ترتیب لیست = جایگاه =====
var DATA={
  girls:[
    // {name:"اسم", img:"img/g1.jpg"},
  ],
  boys:[
    {name:"Amir", title:"رئیس کصخلا", img:"img/b1.jpg"},
  ]
};

// ===== گالری =====
var cur='girls',grid=document.getElementById('grid'),lb=document.getElementById('lb');
function show(){
  grid.innerHTML='';var L=DATA[cur],medals=['🥇','🥈','🥉'];
  if(!L.length){grid.innerHTML='<div class="empty">به‌زودی... 🦋</div>';return}
  L.forEach(function(it,i){
    var c=document.createElement('div');c.className='card'+(i===0?' t1':'');
    c.innerHTML='<img alt=""><span class="rk"></span><b></b><i class="tt"></i>';
    c.querySelector('img').src=it.img;c.querySelector('.rk').textContent=medals[i]||(i+1);c.querySelector('b').textContent=it.name;c.querySelector('.tt').textContent=it.title||'';
    c.onclick=function(){lb.querySelector('img').src=it.img;lb.querySelector('p').textContent=(medals[i]||('#'+(i+1)))+' '+it.name+(it.title?' — '+it.title:'');lb.style.display='flex'};
    grid.appendChild(c);
  });
}
lb.onclick=function(){lb.style.display='none'};
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});t.classList.add('on');cur=t.dataset.k;show()};
});
show();

// ===== اینترو: بمب‌ها =====
var intro=document.getElementById('intro'),flash=document.getElementById('flash'),btn=document.getElementById('enter'),rainOn=false;
var EM=['⭐','🦋','💖','💗','✨','🌟','🦋','💥','🎊','💕'];
function rnd(a,b){return a+Math.random()*(b-a)}
function burst(x,y,n){
  for(var i=0;i<n;i++){
    var s=document.createElement('span');s.className='pt';s.textContent=EM[i%EM.length];
    s.style.left=x+'px';s.style.top=y+'px';s.style.fontSize=rnd(18,42)+'px';intro.appendChild(s);
    var a=rnd(0,6.283),d=rnd(90,Math.max(innerWidth,innerHeight)*.55);
    s.animate([{transform:'translate(0,0) scale(.3) rotate(0)',opacity:1},
      {transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-60)+'px) scale(1.2) rotate('+rnd(-360,360)+'deg)',opacity:1,offset:.6},
      {transform:'translate('+Math.cos(a)*d*1.1+'px,'+(Math.sin(a)*d+160)+'px) scale(.8) rotate('+rnd(-540,540)+'deg)',opacity:0}],
      {duration:rnd(1200,2200),easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=function(e){s.remove()};
  }
}
function explode(id){
  var b=document.getElementById(id),r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  b.classList.add('gone');
  flash.animate([{opacity:.95},{opacity:0}],{duration:450});
  intro.classList.remove('shake');void intro.offsetWidth;intro.classList.add('shake');
  burst(x,y,45);
  var w=document.createElement('div');w.className='bw';w.textContent=['بووووم! 💥','تَرَق! 🧨','بترکه!! 💣'][Math.floor(Math.random()*3)];
  w.style.left=Math.max(10,x-90)+'px';w.style.top=(y-90)+'px';intro.appendChild(w);
  w.animate([{transform:'scale(.2) rotate(-20deg)',opacity:1},{transform:'scale(1.3) rotate(8deg)',opacity:1,offset:.4},{transform:'scale(1) translateY(-40px)',opacity:0}],{duration:1300}).onfinish=function(){w.remove()};
}
function rain(){
  if(!rainOn)return;
  var s=document.createElement('span');s.className='pt';s.textContent=EM[Math.floor(Math.random()*EM.length)];
  s.style.left=rnd(0,100)+'%';s.style.top='-50px';s.style.fontSize=rnd(18,36)+'px';intro.appendChild(s);
  s.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY('+(innerHeight+100)+'px) rotate('+rnd(-400,400)+'deg)'}],{duration:rnd(2500,5000)}).onfinish=function(){s.remove()};
  setTimeout(rain,70);
}
var b1=document.getElementById('bm1'),b2=document.getElementById('bm2');
setTimeout(function(){b1.classList.add('fuse');b2.classList.add('fuse')},2800);
setTimeout(function(){explode('bm1')},4400);
setTimeout(function(){rainOn=true;rain()},4500);
setTimeout(function(){explode('bm2')},5300);
setTimeout(function(){
  btn.disabled=false;btn.textContent='ورود به گالری کصخلا 🚪✨';
},6300);
btn.onclick=function(){
  rainOn=false;intro.classList.add('hide');setTimeout(function(){intro.remove()},1000);
};
</script>
</body>
</html>
